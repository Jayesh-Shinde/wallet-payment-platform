spring.application.name=wallet-payment-platform
spring.datasource.url=jdbc:postgresql://localhost:5432/walletplatform
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.threads.virtual.enabled=true
# ===================================================================
# Kafka Bootstrap Server
# ===================================================================
# Use localhost:9094 if Spring Boot is running directly on your host machine.
# Use kafka:9092 if Spring Boot is also containerized in the same Docker network.
spring.kafka.bootstrap-servers=localhost:9094
# ===================================================================
# Producer Configuration
# ===================================================================
# Serializer class for keys (String is standard)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
# Serializer class for values (StringSerializer or JsonSerializer)
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# Acknowledgment level: 'all' (or '-1') guarantees message durability
spring.kafka.producer.acks=all
# Number of retries on send failure
spring.kafka.producer.retries=3
# Enable idempotence to prevent duplicate messages on retries
spring.kafka.producer.properties.enable.idempotence=true